# CI 共用環境安裝（INFRA-022）。各 job 依需要開關 python / node / supabase。
# 第三方 action 目前以主版號 tag 引用；正式上線前改為 commit SHA 釘選。
name: Setup afterschool toolchain
description: 安裝 uv + Python 3.13、Node 24 + pnpm、just，以及（選用）Supabase CLI

inputs:
  python:
    description: 安裝 uv、Python 3.13 並 uv sync apps/api（"true" / "false"）
    required: false
    default: "true"
  node:
    description: 安裝 Node 24、啟用 corepack 並 pnpm install apps/web（"true" / "false"）
    required: false
    default: "true"
  supabase:
    description: 安裝 Supabase CLI（"true" / "false"）
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: 安裝 uv
      if: inputs.python == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: apps/api/uv.lock

    - name: 安裝 Python 3.13 與 apps/api 依賴
      if: inputs.python == 'true'
      shell: bash
      run: |
        uv python install 3.13
        uv sync --frozen --project apps/api

    - name: 安裝 Node 24
      if: inputs.node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: 啟用 corepack 並取得 pnpm store 路徑
      if: inputs.node == 'true'
      id: pnpm-store
      shell: bash
      working-directory: apps/web
      run: |
        corepack enable
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: 快取 pnpm store
      if: inputs.node == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: 安裝 apps/web 依賴
      if: inputs.node == 'true'
      shell: bash
      working-directory: apps/web
      run: pnpm install --frozen-lockfile

    - name: 安裝 just
      uses: extractions/setup-just@v3

    - name: 安裝 Supabase CLI（與本機主版號 2 相同）
      if: inputs.supabase == 'true'
      uses: supabase/setup-cli@v1
      with:
        version: 2.98.2
