# CI（INFRA-022 骨架）：唯一允許全量執行 lint / test 的地方（docs/testing_conventions.md §4）。
# 後續 job 由 INFRA-023 ~ INFRA-029、INFRA-036 逐一加入本檔；結構測試在 scripts/tests/test_ci_workflow.py。
# 第三方 action 目前以主版號 tag 引用；正式上線前改為 commit SHA 釘選。
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/mockups/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/mockups/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tasks:
    name: 驗證 docs/tasks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: 驗證 tasks.json
        run: python3 scripts/validate_tasks.py .

  lint:
    name: Lint（ruff / eslint）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: ruff
        run: |
          uv run --frozen --project apps/api ruff check apps/api scripts --config apps/api/pyproject.toml
          uv run --frozen --project apps/api ruff format --check apps/api scripts --config apps/api/pyproject.toml

      - name: eslint
        working-directory: apps/web
        run: pnpm exec eslint .

  typecheck:
    name: Typecheck（mypy / vue-tsc）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: mypy app
        working-directory: apps/api
        run: uv run --frozen --project apps/api mypy app

      - name: mypy scripts
        run: uv run --frozen --project apps/api mypy scripts --config-file apps/api/pyproject.toml

      - name: vue-tsc
        run: just web-typecheck

  unit:
    name: 單元測試（後端與 scripts）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: false

      - name: apps/api 單元測試
        working-directory: apps/api
        run: uv run --frozen pytest -m "not integration"

      - name: scripts 單元測試
        run: apps/api/.venv/bin/pytest scripts/tests -m "not integration"

  integration:
    name: 整合測試（Postgres / SeaweedFS）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: false

      - name: 啟動 Postgres 與 SeaweedFS
        run: docker compose -f compose.yaml up -d --wait db storage

      - name: 重建 DB
        run: just db-reset --yes

      - name: apps/api 整合測試
        working-directory: apps/api
        run: uv run --frozen pytest -m integration

      - name: scripts 整合測試
        run: apps/api/.venv/bin/pytest scripts/tests -m integration

      - name: 關閉服務並清除 volume
        if: always()
        run: docker compose -f compose.yaml down -v

  db-checks:
    name: DB 檢查（乾淨套用、單一 head、schema drift）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: false

      - name: 啟動 Postgres
        run: docker compose -f compose.yaml up -d --wait db

      - name: 乾淨 DB 套用全部 revision
        run: just db-reset --yes

      - name: Alembic 歷史只有一個 head
        working-directory: apps/api
        run: test "$(uv run --frozen alembic heads | wc -l)" -eq 1

      - name: Schema drift
        run: just schema-drift

      - name: 關閉服務並清除 volume
        if: always()
        run: docker compose -f compose.yaml down -v

  web-test:
    name: 前端單元測試（vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: false

      - name: vitest
        working-directory: apps/web
        run: pnpm exec vitest run

  web-build:
    name: 前端建置與家長端 bundle 檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: false

      - name: vite build
        working-directory: apps/web
        run: pnpm exec vite build

      - name: 家長端 bundle 不得含 Element Plus 與後台程式碼
        working-directory: apps/web
        run: node scripts/check_parent_bundle.mjs

  docker-build:
    name: Docker 映像建置與容器煙霧測試
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 只建置不推送（Railway 自己建置）；load 讓映像留在本機供後續煙霧測試
      - name: 建置 api 映像
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          load: true
          push: false
          tags: afterschool-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: api 套件可匯入（不啟動 uvicorn，因為需要 DATABASE_URL）
        run: docker run --rm afterschool-api python -c "import app"

      - name: 建置 web 映像
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          load: true
          push: false
          tags: afterschool-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: web 容器煙霧測試
        run: |
          docker run -d --name afterschool-web-smoke -e BACKEND_URL=http://127.0.0.1:9 -p 18080:8080 afterschool-web
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then break; fi
            if [ "$i" -eq 15 ]; then docker logs afterschool-web-smoke; echo "healthz 未就緒" >&2; exit 1; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/parent/)" = "200"
          curl -s -D - -o /dev/null http://127.0.0.1:18080/ | grep -i '^Content-Security-Policy:'

      - name: 移除容器
        if: always()
        run: docker rm -f afterschool-web-smoke || true
