# e2e（INFRA-030）：Playwright 不放進每個 PR 的 CI（docs/testing_conventions.md §3），只在手動與每日排程執行。
# 第三方 action 目前以主版號 tag 引用；正式上線前改為 commit SHA 釘選。
name: e2e

on:
  workflow_dispatch:
  schedule:
    # 台北時間 02:00
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 啟動 Postgres 與 SeaweedFS
        run: docker compose -f compose.yaml up -d --wait db storage

      - name: 重建 DB
        run: just db-reset --yes

      - name: 產生 apps/api/.env（APP_SECRET_KEY 每次隨機）
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -i "s|^APP_SECRET_KEY=.*|APP_SECRET_KEY=$(openssl rand -base64 48)|" apps/api/.env

      - name: 安裝 Playwright 瀏覽器
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: 啟動 API 與 web dev server
        run: DEV_UP_SKIP_DB=1 scripts/dev_up.sh

      - name: Playwright
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: 上傳失敗報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            var/log/
          retention-days: 7

      - name: 關閉服務
        if: always()
        run: scripts/dev_down.sh --all
