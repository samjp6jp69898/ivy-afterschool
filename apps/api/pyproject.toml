[project]
name = "afterschool-api"
version = "0.1.0"
description = "afterschool 安親班管理系統後端（FastAPI）"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "argon2-cffi>=25.1",
  "cryptography>=50.0",
  "pyjwt>=2.15",
  "httpx>=0.28",
  # 4.x API 完全不同，鎖在 3.x
  "apscheduler>=3.11,<4",
  "openpyxl>=3.1",
  "sentry-sdk[fastapi]>=2.71",
  # FastAPI 處理檔案上傳必需（請假附件、學生照片、Excel 匯入）
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-socket>=0.8",
  "ruff>=0.16",
  "mypy>=2.4",
]

[tool.uv]
# 應用程式，不打包成可安裝的套件
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "SIM", "RUF", "PT", "S", "TID"]
# 註解與字串以繁體中文書寫，全形標點不是混淆字元（RUF001~003）
allowed-confusables = ["，", "：", "；", "（", "）", "！", "？", "～"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# 唯一允許直接取系統時間的地方
"app/core/clock.py" = ["TID251", "DTZ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "時間一律從 app.core.clock 取得（Asia/Taipei）"
"datetime.datetime.utcnow".msg = "時間一律從 app.core.clock 取得（Asia/Taipei）"
"datetime.date.today".msg = "時間一律從 app.core.clock 取得（Asia/Taipei）"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["apscheduler.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: 單元測試，不碰 DB 與網路",
  "integration: 整合測試，只連本機 Supabase 127.0.0.1:54342",
]
# 命令列另帶的 -m 會覆蓋這裡的 -m
addopts = "-m 'not integration' --strict-markers --import-mode=importlib --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
xfail_strict = true
