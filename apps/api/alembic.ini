# Alembic 設定（INFRA-045；architecture_decisions §5）。
# 連線字串只從環境變數 MIGRATION_DATABASE_URL 讀取（alembic/env.py），這裡不寫 sqlalchemy.url。
# 本機：just db-migrate / just db-new-migration REV SLUG；雲端：python -m app.cli migrate（Railway pre-deploy）。

[alembic]
script_location = %(here)s/alembic

# 檔名 <revision>_<slug>.py；revision id 以負責的 task 命名（DB-004 → db004，baseline 為 db001）
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
