# 安全標頭 snippet（INFRA-033）：由 default.conf.template 的各靜態內容 location include，不經 envsubst。
#
# 用 include 而非寫在 server 層：location 只要有自己的 add_header（例如 Cache-Control），就完全不繼承
# server 層的 add_header，所以每個靜態 location 都要顯式 include。
#
# CSP 放行來源：
#   - LIFF SDK：script-src static.line-scdn.net；connect-src api.line.me、liffsdk.line-scdn.net
#   - LINE 大頭貼：img-src profile.line-scdn.net、sprofile.line-scdn.net
#   - R2 presigned URL（path-style，<account_id>.r2.cloudflarestorage.com，architecture_decisions §10）：img-src
#   - WebSocket（接送佇列、作業進度看板）：connect-src wss:
# 新增第三方資源時以精準網域放行，不要放寬成 *。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com https://profile.line-scdn.net https://sprofile.line-scdn.net; font-src 'self' data:; connect-src 'self' wss: https://api.line.me https://liffsdk.line-scdn.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
